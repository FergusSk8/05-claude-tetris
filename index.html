<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">0</span>
        </div>

        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">THEME</span>
          <label class="theme-switch">
            <input type="checkbox" id="theme-toggle" />
            <span class="switch-track">
              <span class="switch-thumb"></span>
            </span>
            <span class="switch-label">LIGHT</span>
          </label>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd> reservar</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <!-- Start screen -->
      <div class="overlay-box overlay-start hidden">
        <p class="overlay-heading">TETRIS</p>
        <div id="start-scores-container" class="scores-container"></div>
        <button id="start-btn" class="btn-primary">Iniciar partida</button>
        <button id="start-reset-btn" class="btn-secondary">Resetear records</button>
      </div>

      <!-- Game over screen -->
      <div class="overlay-box overlay-gameover hidden">
        <p class="overlay-heading go-title">GAME OVER</p>
        <p id="go-score" class="go-stats"></p>
        <div id="go-name-block" class="hidden name-input-block">
          <input type="text" id="go-name-input" placeholder="Tu nombre" maxlength="20" />
          <button id="go-save-btn" class="btn-primary">Guardar</button>
        </div>
        <div id="go-scores-container" class="scores-container hidden"></div>
        <div class="overlay-actions">
          <button id="go-reset-btn" class="btn-secondary">Resetear records</button>
          <button id="go-new-btn" class="btn-primary">Nueva partida</button>
        </div>
      </div>

      <!-- Pause screen -->
      <div class="overlay-box overlay-pause hidden">
        <p class="overlay-heading pause-heading">PAUSA</p>
        <button id="resume-btn" class="btn-primary">Reanudar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
